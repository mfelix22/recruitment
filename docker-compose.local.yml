version: '3.8'

services:

  # ─── Laravel App (PHP + Apache) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_app
    restart: unless-stopped
    ports:
      - "6090:80"
    environment:
      APP_NAME: "Recruitment"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:6090}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: recruitment
      DB_USERNAME: recruitment
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-error}
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    networks:
      - recruitment_network
    depends_on:
      db:
        condition: service_healthy

  # ─── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: recruitment_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: recruitment
      MYSQL_USER: recruitment
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - recruitment_network

  # ─── phpMyAdmin ──────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recruitment_phpmyadmin
    restart: unless-stopped
    ports:
      - "6091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: recruitment
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 300M
    networks:
      - recruitment_network
    depends_on:
      db:
        condition: service_healthy

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  recruitment_network:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
  app_storage:
  app_logs:
